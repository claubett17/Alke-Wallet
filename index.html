<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Final - Front End</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #b993d6, transparent 40%),
                radial-gradient(circle at bottom right, #8ca6db, transparent 45%),
                linear-gradient(135deg, #6740a5, #1f1c2c);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-landing {
            background: linear-gradient(
                145deg,
                rgba(255, 231, 240, 0.95),
                rgba(220, 210, 255, 0.95)
            );
            padding: 65px 60px;
            border-radius: 26px;
            max-width: 820px;
            width: 100%;
            text-align: center;

            /* BORDER + SHADOW */
            border: 3px solid rgba(95, 44, 130, 0.35);
            box-shadow:
                0 35px 70px rgba(6, 240, 18, 0.45),
                0 0 0 6px rgba(95, 44, 130, 0.15);
        }

        .badge-project {
            display: inline-block;
            background: linear-gradient(135deg, #5f2c82, #49a09d);
            color: #fff;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 30px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 3.6rem;
            font-weight: 900;
            color: #2b1055;
            margin-bottom: 15px;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #4a2b6f;
            margin-bottom: 35px;
        }

        .divider {
            width: 110px;
            height: 6px;
            background: linear-gradient(135deg, #5f2c82, #49a09d);
            border-radius: 20px;
            margin: 35px auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        p {
            font-size: 1.35rem;
            margin-bottom: 10px;
            color: #333;
            font-weight: 500;
        }

        .btn-landing {
            margin-top: 45px;
            font-size: 1.6rem;
            padding: 18px 60px;
            border-radius: 60px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #5f2c82, #49a09d);
            border: none;
            transition: all 0.35s ease;
            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35),
                inset 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        .btn-landing:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow:
                0 25px 55px rgba(0, 0, 0, 0.45),
                inset 0 0 0 2px rgba(255, 255, 255, 0.35);
            color: #fff;
        }

        @media (max-width: 576px) {
            .container-landing {
                padding: 45px 25px;
            }

            h1 {
                font-size: 2.4rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            p {
                font-size: 1.05rem;
            }

            .btn-landing {
                font-size: 1.25rem;
                padding: 14px 40px;
            }
        }
    </style>
</head>

<body>

    <div class="container-landing">

        <div class="badge-project">
            PROYECTO FINAL
        </div>

        <h1>Módulo #2</h1>
        <h2>ABP Front End · Claudia Bettancourt</h2>

        <div class="divider"></div>

        <p><strong>Fundamentos de Desarrollo Front End</strong></p>
        <p>Bootcamp Full Stack Java Trainee</p>
        <p>Talento Digital · Enero 2026</p>

        <a href="menu.html" class="btn btn-landing">
            Ir al Menú Principal
        </a>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

</body>
</html>
