<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet | Menú</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<!-- CONTENEDOR CENTRADOR -->
<div class="wallet-container min-vh-100 d-flex align-items-center justify-content-center">

    <!-- TARJETA PRINCIPAL -->
    <div class="wallet-card">

        <h3 class="wallet-title">
    Menú Principal
    </h3>

        <!-- SALDO -->
        <div class="saldo-card mb-4">
    <small>Saldo disponible</small>
    <h2 id="saldoDisplay" class="font-weight-bold mt-2">$0</h2>
</div>

        <!-- ACCIONES -->
        <a href="deposit.html" class="btn btn-success btn-lg btn-block mb-3">
            Depositar
        </a>

        <a href="sendmoney.html" class="btn btn-info btn-lg btn-block mb-3">
            Enviar Dinero
        </a>

        <a href="transactions.html" class="btn btn-secondary btn-lg btn-block mb-3">
            Últimos Movimientos
        </a>

        <!-- LOGOUT -->
        <div class="text-center mt-3">
            <a href="#" id="btnLogout" class="text-danger font-weight-bold">
                Cerrar sesión
            </a>
        </div>

    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {

    let saldo = parseInt(localStorage.getItem('saldo'), 10);
    if (isNaN(saldo)) saldo = 3000000;
    localStorage.setItem('saldo', saldo);

    function mostrarSaldo() {
        let saldoActual = parseInt(localStorage.getItem('saldo'), 10);
        if (isNaN(saldoActual)) saldoActual = 0;
        $('#saldoDisplay').text('$' + saldoActual.toLocaleString('es-CL'));
    }

    mostrarSaldo();

    $('#btnLogout').click(function(e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = "login.html";
    });

    window.addEventListener('storage', function(e) {
        if (e.key === 'saldo') mostrarSaldo();
    });

});
</script>

</body>
</html>
