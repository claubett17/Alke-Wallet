<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wallet - Depositar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="wallet-container">
    <div class="wallet-card">

        <h3 class="wallet-title">Depositar Dinero</h3>

        <p id="saldoUsuario" class="text-center font-weight-bold mb-4"></p>

        <div id="alertMensaje" class="alert d-none"></div>

        <form id="depositForm">
            <div class="form-group">
                <label>Monto a depositar</label>
                <input
                    type="number"
                    id="inputDeposito"
                    class="form-control form-control-lg"
                    min="1"
                    required
                >
            </div>

            <button type="submit" class="btn btn-success btn-block">
                Realizar depósito
            </button>
        </form>

        <a href="menu.html" class="btn btn-dark btn-block mt-3">
            Volver al Menú Principal
        </a>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function () {

    function getSaldo() {
        return parseInt(localStorage.getItem('saldo'), 10) || 3000000;
    }

    function setSaldo(valor) {
        localStorage.setItem('saldo', valor);
    }

    function mostrarSaldo() {
        $('#saldoUsuario').text(
            'Saldo actual: $' + getSaldo().toLocaleString('es-CL')
        );
    }

    mostrarSaldo();

    $('#depositForm').submit(function (e) {
        e.preventDefault();

        const monto = parseInt($('#inputDeposito').val(), 10);

        if (isNaN(monto) || monto <= 0) {
            $('#alertMensaje')
                .removeClass()
                .addClass('alert alert-danger')
                .text('Ingrese un monto válido')
                .removeClass('d-none');
            return;
        }

        let saldo = getSaldo();
        saldo += monto;
        setSaldo(saldo);

        let historial = JSON.parse(localStorage.getItem('historial')) || [];
        historial.unshift({
            tipo: 'Depósito',
            descripcion: 'Depósito de dinero',
            monto: monto,
            fecha: new Date().toLocaleString('es-CL'),
            esIngreso: true
        });
        localStorage.setItem('historial', JSON.stringify(historial));

        $('#alertMensaje')
            .removeClass()
            .addClass('alert alert-success')
            .text('Depósito realizado con éxito')
            .removeClass('d-none');

        $('#inputDeposito').val('');
        mostrarSaldo();
    });

});
</script>

</body>
</html>
