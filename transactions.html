<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wallet - Últimos Movimientos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <!-- CSS Base General -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="wallet-container">
    <div class="wallet-card">

        <!-- Título con estilo global -->
        <h3 class="wallet-title">Últimos Movimientos</h3>

        <!-- Saldo Actual -->
        <div class="alert alert-info d-flex justify-content-between align-items-center mb-3">
            <span>Saldo Actual:</span>
            <strong id="saldoDisplay">$0</strong>
        </div>
        
        <!-- Lista de Movimientos -->
        <div id="listaMovimientos" class="list-group mb-4"></div>

    <!-- Volver al Manú -->
    <a href="menu.html" class="btn btn-dark btn-block mt-3">
    Volver al Menú Principal
    </a>

    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<script>
$(document).ready(function() {

    // Función para mostrar el saldo actual
    function mostrarSaldo() {
        var saldo = parseInt(localStorage.getItem('saldo'), 10) || 0;
        $('#saldoDisplay').text('$' + saldo.toLocaleString('es-CL'));
    }

    // Función para cargar movimientos
    function cargarMovimientos() {
        var historial = JSON.parse(localStorage.getItem('historial')) || [];
        var contenedor = $('#listaMovimientos');
        contenedor.html('');

        if(historial.length === 0) {
            contenedor.html('<div class="alert alert-warning text-center">No hay movimientos registrados aún.</div>');
        } else {
            historial.forEach(function(mov) {
                var claseColor = mov.esIngreso ? 'text-success' : 'text-danger';
                var signo = mov.esIngreso ? '+' : '-';

                var itemHTML = `
                    <div class="list-group-item">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">${mov.tipo}</h5>
                            <small class="${claseColor}">$${signo}${mov.monto.toLocaleString('es-CL')}</small>
                        </div>
                        <p class="mb-1">${mov.descripcion}</p>
                        <small class="text-muted">${mov.fecha}</small>
                    </div>
                `;
                contenedor.append(itemHTML);
            });
        }
    }

    // Inicializa página
    mostrarSaldo();
    cargarMovimientos();

    // Listener para actualizar si hay cambios de saldo o historial en otra pestaña
    window.addEventListener('storage', function(event) {
        if(event.key === 'saldo' || event.key === 'historial') {
            mostrarSaldo();
            cargarMovimientos();
        }
    });

});
</script>

</body>
</html>
