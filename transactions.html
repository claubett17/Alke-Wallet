<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wallet - Últimos Movimientos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="wallet-container">
    <div class="wallet-card">

        <!-- Título -->
        <h3 class="wallet-title">Últimos Movimientos</h3>

        <!-- Saldo actual -->
        <div class="alert alert-info d-flex justify-content-between align-items-center mb-4">
            <span>Saldo actual:</span>
            <strong id="saldoDisplay">$0</strong>
        </div>

        <!-- Lista de movimientos -->
        <div id="listaMovimientos" class="list-group mb-4"></div>

        <!-- Volver -->
        <a href="menu.html" class="btn btn-dark btn-block mt-3">
            Volver al Menú Principal
        </a>

    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<script>
$(document).ready(function () {

    function mostrarSaldo() {
        const saldo = parseInt(localStorage.getItem('saldo'), 10) || 0;
        $('#saldoDisplay').text('$' + saldo.toLocaleString('es-CL'));
    }

    function cargarMovimientos() {
        const historial = JSON.parse(localStorage.getItem('historial')) || [];
        const contenedor = $('#listaMovimientos');
        contenedor.empty();

        if (historial.length === 0) {
            contenedor.html(
                '<div class="alert alert-warning text-center">No hay movimientos registrados aún.</div>'
            );
            return;
        }

        historial.forEach(function (mov) {
            const claseColor = mov.esIngreso ? 'text-success' : 'text-danger';
            const signo = mov.esIngreso ? '+' : '-';

            contenedor.append(`
                <div class="list-group-item">
                    <div class="d-flex justify-content-between">
                        <h5 class="mb-1">${mov.tipo}</h5>
                        <span class="${claseColor}">
                            ${signo}$${mov.monto.toLocaleString('es-CL')}
                        </span>
                    </div>
                    <p class="mb-1">${mov.descripcion}</p>
                    <small class="text-muted">${mov.fecha}</small>
                </div>
            `);
        });
    }

    mostrarSaldo();
    cargarMovimientos();

    // Actualiza si hay cambios desde otra pestaña
    window.addEventListener('storage', function (event) {
        if (event.key === 'saldo' || event.key === 'historial') {
            mostrarSaldo();
            cargarMovimientos();
        }
    });

});
</script>

</body>
</html>
