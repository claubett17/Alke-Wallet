<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet | Login</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<!-- Contenedor -->
<div class="wallet-container min-vh-100 d-flex align-items-center justify-content-center">

    <!-- Tarjeta Unica -->
    <div class="wallet-card">

    <h3 class="wallet-title">Login / Acceso</h3>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input 
                    type="email"
                    class="form-control form-control-lg"
                    id="email"
                    placeholder="ejemplo@wallet.com"
                    required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input 
                    type="password"
                    class="form-control form-control-lg"
                    id="password"
                    placeholder="********"
                    required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block">
                Iniciar sesión
            </button>
        </form>

    </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function () {
    $('#loginForm').submit(function (e) {
        e.preventDefault();

        const email = $('#email').val();
        const pass = $('#password').val();

        if (email === 'admin@wallet.com' && pass === '123456') {
            window.location.href = 'menu.html';
        } else {
            alert('Credenciales incorrectas');
            $('#password').val('');
        }
    });
});
</script>

</body>
</html>
