<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wallet - Enviar Dinero</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="wallet-container">
    <div class="wallet-card">

        <!-- Título -->
        <h3 class="wallet-title">Enviar Dinero</h3>

        <!-- Saldo -->
        <p id="saldoUsuario" class="text-center font-weight-bold mb-4"></p>

        <!-- Contacto seleccionado -->
        <div class="form-group">
            <label>Contacto seleccionado</label>
            <input type="text" class="form-control" id="searchContact" readonly>
        </div>

        <!-- Botón agregar contacto -->
        <button class="btn btn-success btn-block mb-3" data-toggle="modal" data-target="#addContactModal">
            + Agregar nuevo contacto
        </button>

        <!-- Lista de contactos -->
        <h5 class="mb-3">Contactos</h5>
        <ul id="contactList" class="list-group mb-4"></ul>

        <hr>

        <!-- Enviar dinero -->
        <div class="form-group">
            <label>Monto</label>
            <input type="number" id="montoEnvio" class="form-control" min="1">
        </div>

        <button class="btn btn-primary btn-block mb-3" id="btnEnviarDinero">
            Enviar dinero
        </button>

        <p id="mensajeEnvio" class="text-success text-center mt-2"></p>

        <!-- Volver al menú -->
        <a href="menu.html" class="btn btn-dark btn-block mt-3">
    Volver al Menú Principal
    </a>

    </div>
</div>

<!-- Modal para agregar contacto -->
<div class="modal fade" id="addContactModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Nuevo Contacto</h5>
                <button class="close" data-dismiss="modal">&times;</button>
            </div>

            <div class="modal-body">
                <form id="addContactForm">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="newContactName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>RUT</label>
                        <input type="text" id="newContactRUT" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Banco</label>
                        <select id="newContactBank" class="form-control">
                            <option>Banco Estado</option>
                            <option>Banco de Chile</option>
                            <option>Banco Santander</option>
                            <option>BCI</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Número de cuenta</label>
                        <input type="number" id="newContactNumber" class="form-control" required>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" id="saveContactBtn">Guardar</button>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<script>
$(document).ready(function () {

    const saldoInicial = 3000000;

    if (isNaN(parseInt(localStorage.getItem('saldo')))) {
        localStorage.setItem('saldo', saldoInicial);
    }

    function getSaldo() {
        return parseInt(localStorage.getItem('saldo'), 10) || 0;
    }

    function mostrarSaldo() {
        $('#saldoUsuario').text(`Saldo: $${getSaldo().toLocaleString('es-CL')}`);
    }

    mostrarSaldo();

    if (!localStorage.getItem('contactos')) {
        localStorage.setItem('contactos', JSON.stringify([
            { nombre: "Juan Pérez", rut: "12.345.678-9", banco: "Banco Estado", numero: "12345678" },
            { nombre: "María González", rut: "9.876.543-2", banco: "Banco de Chile", numero: "87654321" },
            { nombre: "Carlos Tapia", rut: "15.111.222-3", banco: "Banco Santander", numero: "15111222" }
        ]));
    }

    function mostrarContactos() {
        const contactos = JSON.parse(localStorage.getItem('contactos'));
        $('#contactList').empty();

        contactos.forEach((c, i) => {
            $('#contactList').append(`
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${c.nombre}</strong><br>
                        <small class="text-muted">RUT: ${c.rut} | ${c.banco}</small>
                    </div>
                    <div class="d-flex">
                        <button class="btn seleccionar-contacto" data-nombre="${c.nombre}">Seleccionar</button>
                        <button class="eliminar-contacto" data-index="${i}">&times;</button>
                    </div>
                </li>
            `);
        });
    }

    mostrarContactos();

    $(document).on('click', '.seleccionar-contacto', function () {
        $('#searchContact').val($(this).data('nombre'));
    });

    $(document).on('click', '.eliminar-contacto', function () {
        if (!confirm('¿Eliminar contacto?')) return;
        const contactos = JSON.parse(localStorage.getItem('contactos'));
        contactos.splice($(this).data('index'), 1);
        localStorage.setItem('contactos', JSON.stringify(contactos));
        mostrarContactos();
    });

    $('#saveContactBtn').click(function () {
        const contactos = JSON.parse(localStorage.getItem('contactos'));
        contactos.push({
            nombre: $('#newContactName').val(),
            rut: $('#newContactRUT').val(),
            banco: $('#newContactBank').val(),
            numero: $('#newContactNumber').val()
        });
        localStorage.setItem('contactos', JSON.stringify(contactos));
        $('#addContactModal').modal('hide');
        $('#addContactForm')[0].reset();
        mostrarContactos();
    });

    $('#btnEnviarDinero').click(function () {
        const monto = parseInt($('#montoEnvio').val());
        const contacto = $('#searchContact').val();
        let saldo = getSaldo();

        if (!contacto || !monto || monto <= 0 || monto > saldo) return;

        saldo -= monto;
        localStorage.setItem('saldo', saldo);
        mostrarSaldo();

        $('#mensajeEnvio').text(`Has enviado $${monto.toLocaleString()} a ${contacto}`);
        $('#montoEnvio').val('');
        $('#searchContact').val('');
    });
});
</script>

</body>
</html>
